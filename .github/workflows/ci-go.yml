name: CI Go

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - "auth-service/**"
      - "user-service/**"
      - "profil-service/**"
      - "post-service/**"
      - "api-gateway/**"
      - ".github/workflows/ci-go.yml"

# Annule les runs obsolètes d'une même PR / branche.
concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - profil-service
          - post-service
          - api-gateway
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Download modules
        run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Fichiers non formatés (lancer 'gofmt -w .') :"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.service }}
          args: --timeout=5m

      - name: Build
        run: go build ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: go.mod / go.sum à jour
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || { echo "::error::go.mod/go.sum pas à jour — lancer 'go mod tidy'"; exit 1; }

      # Scan de vulnérabilités des dépendances + stdlib. REPORT-ONLY : remonte
      # les CVE en annotation mais ne bloque jamais la PR — une nouvelle CVE
      # stdlib peut apparaître sans changement de code (dépend du cycle de
      # patch Go). À ce jour : 0 vuln (stack alignée sur Go 1.25 + x/net + jwt
      # à jour). Pour le rendre bloquant : retirer le `|| echo` ci-dessous.
      - name: govulncheck (report-only)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./... \
            || echo "::warning::govulncheck a trouvé des vulnérabilités (report-only, non bloquant) — voir le log ci-dessus"
