name: CI Go

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - "auth-service/**"
      - "user-service/**"
      - "profil-service/**"
      - "post-service/**"
      - "message-service/**"
      - "notification-service/**"
      - "report-service/**"
      - "media-service/**"
      - "mail-service/**"
      - "api-gateway/**"
      - "doc/**"
      - "scripts/swagger-aggregate.sh"
      - ".github/workflows/ci-go.yml"

# Annule les runs obsolètes d'une même PR / branche.
concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - profil-service
          - post-service
          - message-service
          - notification-service
          - report-service
          - media-service
          - mail-service
          - api-gateway
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Download modules
        run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Fichiers non formatés (lancer 'gofmt -w .') :"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.service }}
          args: --timeout=5m

      - name: Build
        run: go build ./...

      # MongoDB éphémère pour les tests d'INTÉGRATION du report-service (dépôt +
      # service + handlers adossés à une vraie base). Scopé à ce seul service via
      # la matrice : les autres jobs ne paient pas le coût du conteneur. Les tests
      # lisent MONGO_TEST_URI ; s'il est absent (run local), ils sont ignorés
      # (t.Skip) — la base n'est donc requise qu'ici.
      - name: Start MongoDB (report-service integration tests)
        if: matrix.service == 'report-service'
        run: |
          docker run -d --name mongo-test -p 27017:27017 mongo:7
          for i in $(seq 1 30); do
            if docker exec mongo-test mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; then
              echo "MongoDB prêt"; exit 0
            fi
            sleep 1
          done
          echo "::error::MongoDB n'a pas démarré à temps"; exit 1

      - name: Test (race detector + coverage)
        env:
          MONGO_TEST_URI: ${{ matrix.service == 'report-service' && 'mongodb://localhost:27017' || '' }}
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Filtre le profil de couverture AVANT l'upload : on retire le code non
      # testable unitairement (main.go = bootstrap du process), généré (swaggo,
      # docs/docs.go) et l'infrastructure de test (helper Mongo mongotest). Plus
      # fiable que de compter sur le `ignore` du codecov.yml (résolution de la
      # config côté Codecov parfois capricieuse). La 1re ligne `mode:` est gardée.
      - name: Filtrer la couverture (bootstrap + généré + infra de test)
        run: |
          grep -vE '(/main\.go:|/docs/docs\.go:|/internal/mongotest/)' coverage.out > coverage.filtered.out
          mv coverage.filtered.out coverage.out

      # Upload de la couverture vers Codecov, un flag par service pour une
      # lecture service-par-service. Non bloquant (fail_ci_if_error: false) :
      # un hoquet Codecov ne doit jamais casser la CI.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.service }}/coverage.out
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

      - name: go.mod / go.sum à jour
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || { echo "::error::go.mod/go.sum pas à jour — lancer 'go mod tidy'"; exit 1; }

      # Scan de vulnérabilités des dépendances + stdlib. REPORT-ONLY : remonte
      # les CVE en annotation mais ne bloque jamais la PR — une nouvelle CVE
      # stdlib peut apparaître sans changement de code (dépend du cycle de
      # patch Go). À ce jour : 0 vuln (stack alignée sur Go 1.25 + x/net + jwt
      # à jour). Pour le rendre bloquant : retirer le `|| echo` ci-dessous.
      - name: govulncheck (report-only)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./... \
            || echo "::warning::govulncheck a trouvé des vulnérabilités (report-only, non bloquant) — voir le log ci-dessus"

  swagger:
    name: Swagger - drift check + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false   # pas de go.sum à la racine

      - name: Installer swag (générateur annotations → spec)
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Installer go-swagger (validateur Swagger 2.0)
        run: go install github.com/go-swagger/go-swagger/cmd/swagger@latest

      - name: Installer pyyaml (sortie YAML du script d'agrégation)
        run: pip install pyyaml --quiet

      - name: Régénérer le spec OpenAPI
        run: make swagger

      - name: Drift check
        run: |
          git diff --exit-code doc/openapi.json doc/openapi.yaml \
            || {
              echo "::error::Le spec OpenAPI dans doc/ est périmé."
              echo "::error::Lancez 'make swagger' localement et committez le résultat."
              exit 1
            }

      - name: Valider le spec OpenAPI (Swagger 2.0)
        run: swagger validate doc/openapi.json
