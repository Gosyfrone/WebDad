name: Build & Deploy

on:
  push:
    branches: [main, develop]

env:
  # GHCR exige un nom de dépôt en minuscules ; github.repository_owner vaut
  # "Gosyfrone" (majuscule) → on fige la valeur en minuscules.
  IMAGE_BASE: ghcr.io/gosyfrone/webdad

jobs:
  # ── 1. Calcul du tag image ───────────────────────────────────────
  # main et develop déploient TOUS DEUX sur l'environnement production
  # (develop = prod réelle ; main = dépôt de code). Tag image distinct par
  # branche pour que les deux coexistent dans GHCR ; le déploiement pull le
  # tag de la branche poussée.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

  # ── 2. Build & push de chaque service en parallèle ───────────────
  build-push:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-service,        context: ./auth-service }
          - { name: user-service,        context: ./user-service }
          - { name: profil-service,      context: ./profil-service }
          - { name: post-service,        context: ./post-service }
          - { name: message-service,     context: ./message-service }
          - { name: notification-service, context: ./notification-service }
          - { name: media-service,       context: ./media-service }
          - { name: mail-service,        context: ./mail-service }
          - { name: api-gateway,         context: ./api-gateway }
          - { name: frontend,            context: ./frontend }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build args (frontend uniquement)
        id: args
        run: |
          if [ "${{ matrix.name }}" = "frontend" ]; then
            echo "value=NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> $GITHUB_OUTPUT
          else
            echo "value=" >> $GITHUB_OUTPUT
          fi

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.name }}:${{ needs.prepare.outputs.tag }}
          build-args: ${{ steps.args.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/${{ matrix.name }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_BASE }}/${{ matrix.name }}:buildcache,mode=max

  # ── 3. Déploiement ────────────────────────────────────────────────
  deploy:
    name: Deploy → production
    needs: [prepare, build-push]
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Secrets requis dans l'environnement GitHub "production" :
      #   OVH_HOST · OVH_USER · OVH_SSH_KEY
      # Prérequis VPS : repo cloné dans /opt/breezy, <service>/.env + .env racine
      # remplis, Caddyfile présent, Docker + compose installés, user dans le
      # groupe docker.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key:      ${{ secrets.OVH_SSH_KEY }}
          script: |
            cd /opt/breezy
            # Synchronise le checkout sur la branche qui vient d'être poussée
            # (main ou develop déploient la même prod ; -B force le suivi
            # propre même en alternant de branche).
            git fetch origin ${{ github.ref_name }}
            git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE_TAG=${{ needs.prepare.outputs.tag }} \
              docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG=${{ needs.prepare.outputs.tag }} \
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
