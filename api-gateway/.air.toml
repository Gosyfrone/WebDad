# Config air (hot-reload Go en conteneur). Utilisée par le stage `dev`
# du Dockerfile via docker-compose.dev.yml. Le binaire main est dans
# package racine (`.`), build vers ./tmp (volume anonyme, pas sur l'hôte).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  delay = 500            # ms avant rebuild après un changement
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[misc]
  clean_on_exit = true
