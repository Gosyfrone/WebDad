          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Unauthorized
          schema:
            type: object
            additionalProperties:
              type: string
  /media/{id}:
    get:
      produces:
      - application/octet-stream
      tags:
      - media
      summary: Télécharger un média (lecture publique, streaming + Range)
      parameters:
      - type: string
        description: Media ID
        name: id
        in: path
        required: true
      responses:
        '200':
          description: Contenu binaire
          schema:
            type: file
        '206':
          description: Contenu partiel (Range)
          schema:
            type: file
        '404':
          description: Not Found
          schema:
            type: object
            additionalProperties:
              type: string
    delete:
      security:
      - BearerAuth: []
      produces:
      - application/json
      tags:
      - media
      summary: Supprimer un média (propriétaire ou admin)
      parameters:
      - type: string
        description: Media ID
        name: id
        in: path
        required: true
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          schema:
            type: object
            additionalProperties:
              type: string
        '403':
          description: Forbidden
          schema:
            type: object
            additionalProperties:
              type: string
        '404':
          description: Not Found
          schema:
            type: object
            additionalProperties:
              type: string
