        description: 'IsAdult / NsfwVisible : politique « viewer » TRANSIENTE (bson:"-",
          jamais

          stockée), calculée serveur depuis birth_date et exposée seulement sur la
          vue

          privée /profils/me. IsAdult = ≥18 ans (dynamique : se débloque tout seul
          le

          jour des 18 ans). NsfwVisible = IsAdult && NsfwEnabledOf : un mineur ne
          peut

          pas se faire passer pour majeur (front non autoritatif, cf. Rule 6).'
        type: boolean
