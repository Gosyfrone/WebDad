swagger: '2.0'
info:
  contact: {}
  title: Breezy API
  description: API agrégée de la plateforme Breezy (réseau social microservices).
  version: '1.0'
paths:
  /auth/email/change/confirm:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Confirmer un changement d'adresse e-mail
      parameters:
      - description: Jeton reçu à la nouvelle adresse
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.ConfirmEmailChangeRequest'
      responses:
        '200':
          description: 'Adresse modifiée et session ouverte — data: {token, refresh_token,
            user}'
          schema:
            $ref: '#/definitions/models.AuthUser'
        '400':
          description: Jeton invalide/expiré ou adresse devenue indisponible
          schema:
            type: object
            additionalProperties:
              type: string
        '403':
          description: Compte désactivé
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/email/change/request:
    post:
      security:
      - BearerAuth: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Demander un changement d'adresse e-mail
      parameters:
      - description: Nouvelle adresse e-mail
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.ChangeEmailRequest'
      responses:
        '200':
          description: Lien de confirmation envoyé à la nouvelle adresse
          schema:
            type: object
            additionalProperties:
              type: string
        '400':
          description: Payload invalide, adresse identique ou déjà utilisée
          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
        '403':
          description: Compte désactivé
          schema:
            type: object
            additionalProperties:
              type: string
        '404':
          description: Compte introuvable
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
        '503':
          description: Service d'envoi d'e-mail indisponible
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/login:
    post:
      description: Accepte `email` pour le login classique, ou `user_id` quand le
        BFF a résolu un username via user-service. `password` est toujours requis.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Se connecter
      parameters:
      - description: Credentials (email ou user_id + password)
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      responses:
        '200':
          description: 'Connexion réussie — data: {token, refresh_token, user} ; si
            MFA active : data: {mfa_required: true, challenge} (aucun token, appeler
            /auth/mfa/verify)'
          schema:
            $ref: '#/definitions/models.AuthUser'
        '400':
          description: Payload invalide
          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Credentials invalides
          schema:
            type: object
            additionalProperties:
              type: string
        '403':
          description: 'Compte désactivé ou e-mail non vérifié (code: email_not_verified)'
          schema:
            type: object
            additionalProperties:
              type: string
        '409':
          description: Compte sans mot de passe (connexion via Google)
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/logout:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Se déconnecter (best-effort)
      parameters:
      - description: Refresh token (optionnel)
        name: body
        in: body
        schema:
          $ref: '#/definitions/models.RefreshRequest'
      responses:
        '200':
          description: Déconnecté
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/mfa/disable:
    post:
      security:
      - BearerAuth: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Désactiver la MFA
      parameters:
      - description: Code TOTP courant OU mot de passe du compte
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.MFADisableRequest'
      responses:
        '200':
          description: 'data: {enabled: false}'
          schema:
            type: object
            additionalProperties:
              type: boolean
        '400':
          description: 'Preuve invalide (code: invalid_mfa_code) ou MFA non active
            (code: mfa_not_enabled)'
          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
        '503':
          description: MFA non configurée
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/mfa/enable:
    post:
      security:
      - BearerAuth: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Activer la MFA (confirmation du code)
      parameters:
      - description: Code TOTP affiché par l'app
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.MFAEnableRequest'
      responses:
        '200':
          description: 'data: {enabled: true}'
          schema:
            type: object
            additionalProperties:
              type: boolean
        '400':
          description: 'Code invalide (code: invalid_mfa_code) ou aucun setup en attente
            (code: mfa_not_pending)'
          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
        '409':
          description: MFA déjà activée
          schema:
            type: object
            additionalProperties:
              type: string
        '503':
          description: MFA non configurée
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/mfa/setup:
    post:
      security:
      - BearerAuth: []
      description: 'Génère un secret TOTP et renvoie un QR code (data URI) + l''URI
        otpauth:// à scanner dans une app d''authentification. Le secret n''est PAS
        encore actif : il faut le confirmer via /auth/mfa/enable.'
      produces:
      - application/json
      tags:
      - auth
      summary: Démarrer la configuration MFA (TOTP)
      responses:
        '200':
          description: 'data: {secret, otpauth_url, qr_data_uri}'
          schema:
            $ref: '#/definitions/models.MFASetupData'
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
        '409':
          description: MFA déjà activée
          schema:
            type: object
            additionalProperties:
              type: string
        '503':
          description: 'MFA non configurée (code: mfa_not_configured)'
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/mfa/status:
    get:
      security:
      - BearerAuth: []
      produces:
      - application/json
      tags:
      - auth
      summary: Statut MFA du compte
      responses:
        '200':
          description: 'data: {enabled, configured}'
          schema:
            type: object
            additionalProperties:
              type: boolean
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/mfa/verify:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Valider le second facteur (login MFA)
      parameters:
      - description: Challenge (issu du login) + code TOTP
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.MFAVerifyRequest'
      responses:
        '200':
          description: 'Connexion réussie — data: {token, refresh_token, user}'
          schema:
            $ref: '#/definitions/models.AuthUser'
        '400':
          description: 'Challenge invalide/expiré (code: invalid_challenge) ou code
            TOTP faux (code: invalid_mfa_code)'
          schema:
            type: object
            additionalProperties:
              type: string
        '403':
          description: Compte désactivé
          schema:
            type: object
            additionalProperties:
              type: string
        '503':
          description: MFA non configurée
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/oauth/{provider}/complete:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Créer un compte après onboarding OAuth
      parameters:
      - enum:
        - google
        - github
        type: string
        description: Fournisseur OAuth
        name: provider
        in: path
        required: true
      - description: Token d'inscription OAuth
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.OAuthCompleteRequest'
      responses:
        '200':
          description: 'Compte créé — data: {token, refresh_token, user}'
          schema:
            $ref: '#/definitions/models.AuthUser'
        '400':
          description: Payload invalide
          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Token invalide ou expiré
          schema:
            type: object
            additionalProperties:
              type: string
        '409':
          description: Compte déjà créé
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/oauth/{provider}/exchange:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Finaliser une connexion OAuth (Google, GitHub)
      parameters:
      - enum:
        - google
        - github
        type: string
        description: Fournisseur OAuth
        name: provider
        in: path
        required: true
      - description: Code d'autorisation
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.OAuthExchangeRequest'
      responses:
        '200':
          description: Connexion réussie ou inscription à finaliser
          schema:
            $ref: '#/definitions/models.OAuthExchangeData'
        '400':
          description: Payload invalide
          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Échange/vérification OAuth échoué ou email non vérifié
          schema:
            type: object
            additionalProperties:
              type: string
        '403':
          description: Compte désactivé
          schema:
            type: object
            additionalProperties:
              type: string
        '404':
          description: Provider non supporté/configuré
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/oauth/{provider}/url:
    get:
      produces:
      - application/json
      tags:
      - auth
      summary: Démarrer une connexion OAuth (Google, GitHub)
      parameters:
      - enum:
        - google
        - github
        type: string
        description: Fournisseur OAuth
        name: provider
        in: path
        required: true
      responses:
        '200':
          description: 'data: {url, state}'
          schema:
            $ref: '#/definitions/models.OAuthURLData'
        '404':
          description: Provider non supporté/configuré
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/password/change:
    post:
      security:
      - BearerAuth: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Changer son mot de passe
      parameters:
      - description: Mot de passe actuel + nouveau mot de passe (min 8 chars)
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordRequest'
      responses:
        '200':
          description: 'Mot de passe changé — data: {token, refresh_token, user}'
          schema:
            $ref: '#/definitions/models.AuthUser'
        '400':
          description: 'Payload invalide ou mot de passe actuel invalide (code: invalid_current_password)'
          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
        '404':
          description: Compte introuvable
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/password/forgot:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Demander une réinitialisation de mot de passe
      parameters:
      - description: Adresse e-mail
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.ForgotPasswordRequest'
      responses:
        '200':
          description: 'Réponse générique — data: {message}'
          schema:
            type: object
            additionalProperties:
              type: string
        '400':
          description: Payload invalide
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/password/reset:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Réinitialiser le mot de passe
      parameters:
      - description: Token de reset (issu du lien e-mail) + nouveau mot de passe
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.ResetPasswordRequest'
      responses:
        '200':
          description: 'Mot de passe réinitialisé — data: {message}'
          schema:
            type: object
            additionalProperties:
              type: string
        '400':
          description: 'Token invalide ou expiré (code: invalid_token) / payload invalide'
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/refresh:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Rafraîchir les tokens
      parameters:
      - description: Refresh token
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.RefreshRequest'
      responses:
        '200':
          description: 'Nouvelle paire tokens — data: {token, refresh_token, user}'
          schema:
            $ref: '#/definitions/models.AuthUser'
        '401':
          description: Token absent/invalide/expiré
          schema:
            type: object
            additionalProperties:
              type: string
        '403':
          description: Compte désactivé
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/register:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Créer un compte
      parameters:
      - description: Email + mot de passe (min 8 chars)
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      responses:
        '201':
          description: 'Compte créé, mail de vérification envoyé (best-effort) — data:
            {token, refresh_token, user}'
          schema:
            $ref: '#/definitions/models.AuthUser'
        '400':
          description: Payload invalide
          schema:
            type: object
            additionalProperties:
              type: string
        '409':
          description: Email déjà utilisé
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/terms/accept:
    post:
      security:
      - BearerAuth: []
      produces:
      - application/json
      tags:
      - auth
      summary: Accepter les CGU en vigueur
      responses:
        '200':
          description: 'CGU acceptées — data: {token, refresh_token, user}'
          schema:
            $ref: '#/definitions/models.AuthUser'
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
        '404':
          description: Compte introuvable
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/users:
    get:
      security:
      - BearerAuth: []
      produces:
      - application/json
      tags:
      - admin
      summary: Lister les comptes (modérateur/admin)
      parameters:
      - type: string
        description: Filtre email (sous-chaîne)
        name: q
        in: query
      - type: integer
        description: Nombre de résultats (défaut 20, max 100)
        name: limit
        in: query
      - type: integer
        description: Décalage de pagination
        name: offset
        in: query
      responses:
        '200':
          description: 'data: []User'
          schema:
            type: object
            additionalProperties: true
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
        '403':
          description: Rôle insuffisant
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
    post:
      security:
      - BearerAuth: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - admin
      summary: Créer un compte avec mot de passe temporaire (admin)
      parameters:
      - description: Email + mot de passe temporaire (+ username pour l'e-mail)
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.AdminCreateUserRequest'
      responses:
        '201':
          description: 'data: {id, email}'
          schema:
            type: object
            additionalProperties: true
        '400':
          description: Payload invalide
          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
        '403':
          description: Rôle insuffisant
          schema:
            type: object
            additionalProperties:
              type: string
        '409':
          description: Email déjà utilisé
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/users/roles:
    get:
      security:
      - BearerAuth: []
      produces:
      - application/json
      tags:
      - auth
      summary: Rôles publics d'affichage
      parameters:
      - type: string
        description: IDs utilisateurs séparés par des virgules
        name: ids
        in: query
        required: true
      responses:
        '200':
          description: 'data: []PublicRole'
          schema:
            type: object
            additionalProperties: true
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/users/{id}:
    delete:
      security:
      - BearerAuth: []
      produces:
      - application/json
      tags:
      - admin
      summary: Supprimer définitivement un compte (admin, RGPD)
      parameters:
      - type: string
        description: ID de l'utilisateur cible
        name: id
        in: path
        required: true
      responses:
        '204':
          description: Compte supprimé
        '400':
          description: Auto-suppression interdite
          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
        '403':
          description: Rôle insuffisant
          schema:
            type: object
            additionalProperties:
              type: string
        '404':
          description: Compte introuvable
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/users/{id}/role:
    patch:
      security:
      - BearerAuth: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - admin
      summary: Changer le rôle d'un compte (admin)
      parameters:
      - type: string
        description: ID de l'utilisateur cible
        name: id
        in: path
        required: true
      - description: Nouveau rôle
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateRoleRequest'
      responses:
        '200':
          description: 'data: {id, role}'
          schema:
            type: object
            additionalProperties: true
        '400':
          description: Payload invalide ou auto-modification
          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
        '403':
          description: Rôle insuffisant
          schema:
            type: object
            additionalProperties:
              type: string
        '404':
          description: Compte introuvable
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/users/{id}/status:
    patch:
      security:
      - BearerAuth: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - admin
      summary: Bannir / réactiver un compte (modérateur/admin)
      parameters:
      - type: string
        description: ID de l'utilisateur cible
        name: id
        in: path
        required: true
      - description: Nouvel état actif
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateStatusRequest'
      responses:
        '200':
          description: 'data: {id, is_active}'
          schema:
            type: object
            additionalProperties: true
        '400':
          description: Payload invalide ou auto-modification
          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Non authentifié
          schema:
            type: object
            additionalProperties:
              type: string
        '403':
          description: Rôle insuffisant
          schema:
            type: object
            additionalProperties:
              type: string
        '404':
          description: Compte introuvable
          schema:
            type: object
            additionalProperties:
              type: string
        '500':
          description: Erreur interne
          schema:
            type: object
            additionalProperties:
              type: string
  /auth/validate:
    get:
      security:
      - BearerAuth: []
      produces:
      - application/json
      tags:
      - auth
      summary: Valider un access token (usage gateway)
      responses:
        '200':
          description: 'Claims — data: {user_id, email, role}'
          schema:
            type: object
            additionalProperties:
              type: string
        '401':
          description: Token invalide
          schema:
            type: object
            additionalProperties:
