networks:
  webdad-net:
    driver: bridge

volumes:
  postgres-auth-data:
  postgres-user-data:
  mongo-profil-data:
  mongo-post-data:
  mongo-message-data:
  mongo-notification-data:
  minio-data:

# ────────────────────────────────────────────────────────────────────
# Convention de config :
#   - .env (racine)      : variables TRANSVERSES (JWT_SECRET, JWT_EXPIRY...)
#                          → seules celles-ci alimentent l'interpolation ${...}
#   - <service>/.env     : config propre au service, lue via `env_file:`
#                          (les variables d'un env_file ne sont PAS
#                           interpolables dans ce fichier, seulement
#                           injectées dans le conteneur).
#   - environment:       : uniquement les OVERRIDES Docker (host = nom de
#                          conteneur) + injection des secrets partagés.
#
# Prérequis : `cp .env.example .env` à la racine ET dans chaque service.
# ────────────────────────────────────────────────────────────────────

services:

  # ─── Bases de données ────────────────────────────────────────────
  postgres-auth:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./auth-service/.env          # POSTGRES_DB / USER / PASSWORD
    # Pas de script d'init monté : auth-service applique lui-même son
    # schéma au démarrage (internal/db/schema.sql, idempotent) → source
    # de vérité unique, et le service reste autonome.
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - webdad-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-user:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./user-service/.env
    volumes:
      # Schéma appliqué par le service lui-même au boot (EnsureSchema,
      # embarqué) → plus de script init-db monté. Cf. user-service/internal/db.
      - postgres-user-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - webdad-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-profil:
    image: mongo:7
    restart: unless-stopped
    env_file:
      - ./profil-service/.env        # MONGO_INITDB_ROOT_* / DATABASE
    volumes:
      - mongo-profil-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - webdad-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-post:
    image: mongo:7
    restart: unless-stopped
    env_file:
      - ./post-service/.env
    # Pas de script d'init monté : post-service crée lui-même ses collections,
    # validateurs et index au démarrage (EnsureSchema, idempotent) → source de
    # vérité unique côté service, et le service reste autonome.
    volumes:
      - mongo-post-data:/data/db
    ports:
      - "27018:27017"
    networks:
      - webdad-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-message:
    image: mongo:7
    restart: unless-stopped
    env_file:
      - ./message-service/.env       # MONGO_INITDB_ROOT_* / DATABASE
    # Pas de script d'init monté : message-service crée lui-même ses
    # collections, validateurs et index au démarrage (EnsureSchema, idempotent).
    volumes:
      - mongo-message-data:/data/db
    ports:
      - "27019:27017"
    networks:
      - webdad-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-notification:
    image: mongo:7
    restart: unless-stopped
    env_file:
      - ./notification-service/.env  # MONGO_INITDB_ROOT_* / DATABASE
    # Pas de script d'init monté : notification-service crée lui-même sa
    # collection, son validateur et ses index au démarrage (EnsureSchema).
    volumes:
      - mongo-notification-data:/data/db
    ports:
      - "27020:27017"
    networks:
      - webdad-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Stockage objet (MinIO) ──────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./media-service/.env         # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"                  # API S3
      - "9001:9001"                  # console web (dev)
    networks:
      - webdad-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Services Go ─────────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./auth-service/.env          # PORT, DB_*, POSTGRES_*
    environment:
      DB_HOST: postgres-auth         # override : nom du conteneur dans le réseau
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}   # secret partagé (racine)
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
    ports:
      - "8081:8081"
    networks:
      - webdad-net
    depends_on:
      postgres-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./user-service/.env
    environment:
      DB_HOST: postgres-user
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      PROFIL_SERVICE_URL: http://profil-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      INTERNAL_EVENT_SECRET: ${INTERNAL_EVENT_SECRET:?INTERNAL_EVENT_SECRET requis}
    ports:
      - "8082:8082"
    networks:
      - webdad-net
    depends_on:
      postgres-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  profil-service:
    build:
      context: ./profil-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./profil-service/.env
    environment:
      MONGO_HOST: mongo-profil       # override : nom du conteneur dans le réseau
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
    ports:
      - "8083:8083"
    networks:
      - webdad-net
    depends_on:
      mongo-profil:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./post-service/.env
    environment:
      MONGO_HOST: mongo-post         # override : nom du conteneur dans le réseau
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      # Émission des événements de notification (serveur-à-serveur, best-effort).
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      INTERNAL_EVENT_SECRET: ${INTERNAL_EVENT_SECRET:?INTERNAL_EVENT_SECRET requis}
      USER_SERVICE_URL: http://user-service:8082
      PROFIL_SERVICE_URL: http://profil-service:8083
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
    ports:
      - "8084:8084"
    networks:
      - webdad-net
    depends_on:
      mongo-post:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  message-service:
    build:
      context: ./message-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./message-service/.env
    environment:
      MONGO_HOST: mongo-message       # override : nom du conteneur dans le réseau
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      # Émission des mentions en message (serveur-à-serveur, best-effort).
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      INTERNAL_EVENT_SECRET: ${INTERNAL_EVENT_SECRET:?INTERNAL_EVENT_SECRET requis}
    ports:
      - "8085:8085"
    networks:
      - webdad-net
    depends_on:
      mongo-message:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./notification-service/.env
    environment:
      MONGO_HOST: mongo-notification  # override : nom du conteneur dans le réseau
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      INTERNAL_EVENT_SECRET: ${INTERNAL_EVENT_SECRET:?INTERNAL_EVENT_SECRET requis}
      # Résolution des mentions (@handle → user_id) via le user-service.
      USER_SERVICE_URL: http://user-service:8082
    ports:
      - "8086:8086"
    networks:
      - webdad-net
    depends_on:
      mongo-notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./media-service/.env
    environment:
      MINIO_ENDPOINT: minio:9000     # override : nom du conteneur dans le réseau
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
    ports:
      - "8087:8087"
    networks:
      - webdad-net
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./api-gateway/.env
    environment:
      # override : on vise les conteneurs au lieu de localhost
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      PROFIL_SERVICE_URL: http://profil-service:8083
      POST_SERVICE_URL: http://post-service:8084
      MESSAGE_SERVICE_URL: http://message-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      MEDIA_SERVICE_URL: http://media-service:8087
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
    ports:
      - "8080:8080"
    networks:
      - webdad-net
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      profil-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ─── Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      # Client (navigateur) : gateway via le port publié sur l'hôte.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      # Serveur (route handlers Next) : gateway via le réseau Docker.
      API_INTERNAL_URL: http://api-gateway:8080
      # Serveur (route handlers Next) : fournisseur de traduction automatique.
      TRANSLATION_API_URL: ${TRANSLATION_API_URL:-https://libretranslate.de/translate}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
    ports:
      - "3000:3000"
    networks:
      - webdad-net
    depends_on:
      api-gateway:
        condition: service_healthy
